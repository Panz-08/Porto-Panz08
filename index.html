<!doctype html>
<!-- [UBAH] lang="pt-br" → "en" (konten berbahasa Inggris); title/description/OG diganti jadi milikmu -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- [UBAH] viewport-fit=cover: layar HP berponi/notch terpakai penuh (dipadukan env(safe-area-inset-*) di CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d92323" />
    <title>Alpanza Triadie — Portfolio</title>
    <meta name="description" content="Portfolio of Alpanza Triadie — IT Network Engineering student & backend developer from Indonesia." />
    <meta property="og:title" content="Alpanza Triadie — Portfolio" />
    <meta property="og:description" content="Persona 5 themed portfolio: about, resume, socials and side projects." />
    <meta property="og:type" content="website" />

    <!-- [UBAH] Dulu: Anton (tak terpakai), Bebas Neue lewat CSS @import (memblokir render, dimuat 2x),
         dan Barlow Condensed (tak terpakai). Sekarang hanya Bebas Neue, 1x, lewat <link> + display=swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
    <!-- font utama kecil (7 KB) → di-preload agar menu tidak "berkedip" -->
    <link rel="preload" href="/fonts/Persona5main.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
